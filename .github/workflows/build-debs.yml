name: Build & Publish Debian Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: noble
            image: ubuntu:24.04
          - distro: bookworm
            image: debian:bookworm

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    name: Build (${{ matrix.distro }})

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install base build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            debhelper \
            wget \
            curl \
            ca-certificates \
            git \
            liblz4-dev \
            wayland-protocols \
            libwayland-dev \
            meson \
            ninja-build \
            golang-go \
            dh-python \
            python3-all \
            python3-setuptools \
            python3-wheel \
            python3-build \
            python3-pip \
            libgtk-3-dev \
            patchutils

      - name: Install latest Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Fetch upstream sources
        run: |
          # awww
          cd awww
          wget -q https://codeberg.org/LGFae/awww/archive/v0.12.1.tar.gz
          tar --strip-components=1 -xf v0.12.1.tar.gz
          rm v0.12.1.tar.gz
          cd ..

          # matugen
          cd matugen
          wget -q https://github.com/InioX/matugen/archive/refs/tags/v4.1.0.tar.gz
          tar --strip-components=1 -xf v4.1.0.tar.gz
          rm v4.1.0.tar.gz
          cd ..

          # fabric-cli
          cd fabric-cli
          wget -q https://github.com/Fabric-Development/fabric-cli/archive/refs/heads/main.tar.gz
          tar --strip-components=1 -xf main.tar.gz
          rm main.tar.gz
          cd ..

          # python-fabric-widgets
          cd python-fabric-widgets
          wget -q https://github.com/Fabric-Development/fabric/archive/refs/tags/v0.0.2.tar.gz
          tar --strip-components=1 -xf v0.0.2.tar.gz
          rm v0.0.2.tar.gz
          cd ..

          # python-thefuzz
          cd python-thefuzz
          wget -q https://files.pythonhosted.org/packages/source/t/thefuzz/thefuzz-0.22.1.tar.gz
          tar --strip-components=1 -xf thefuzz-0.22.1.tar.gz
          rm thefuzz-0.22.1.tar.gz
          cd ..

          # caffyne-shell
          cd caffyne-shell
          wget -q https://github.com/caffyne-org/caffyne-shell/archive/refs/heads/main.tar.gz
          tar --strip-components=1 -xf main.tar.gz
          rm main.tar.gz
          cd ..

      - name: Update changelogs for distro
        run: |
          # Stamp each changelog with the correct suite for this matrix target
          for pkg in awww matugen fabric-cli python-fabric-widgets python-thefuzz caffyne-shell; do
            sed -i "1s/) [a-z]*/\) ${{ matrix.distro }}/" $pkg/debian/changelog
          done

      - name: Build awww
        run: |
          cd awww
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          dpkg -i ../awww_*.deb
          cd ..

      - name: Build matugen
        run: |
          cd matugen
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          dpkg -i ../matugen_*.deb
          cd ..

      - name: Build fabric-cli
        run: |
          cd fabric-cli
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          dpkg -i ../fabric-cli_*.deb
          cd ..

      - name: Build python-fabric-widgets
        run: |
          cd python-fabric-widgets
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          dpkg -i ../python3-fabric-widgets_*.deb
          cd ..

      - name: Build python-thefuzz
        run: |
          cd python-thefuzz
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          dpkg -i ../python3-thefuzz_*.deb
          cd ..

      - name: Build caffyne-shell
        run: |
          cd caffyne-shell
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          cd ..

      - name: Collect .deb files
        run: |
          mkdir -p output/${{ matrix.distro }}
          cp ../*.deb output/${{ matrix.distro }}/
          ls -lh output/${{ matrix.distro }}/

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.distro }}
          path: output/${{ matrix.distro }}/*.deb
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    name: Publish apt repo

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: Set up gh-pages branch if missing
        run: |
          if [ ! -f index.html ]; then
            git checkout --orphan gh-pages 2>/dev/null || true
            git rm -rf . 2>/dev/null || true
            mkdir -p dists
          fi

      - name: Checkout packaging repo to temp dir
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Download noble debs
        uses: actions/download-artifact@v4
        with:
          name: debs-noble
          path: incoming/noble

      - name: Download bookworm debs
        uses: actions/download-artifact@v4
        with:
          name: debs-bookworm
          path: incoming/bookworm

      - name: Install reprepro
        run: sudo apt-get install -y reprepro gnupg

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}

      - name: Set up reprepro config
        run: |
          mkdir -p conf

          cat > conf/distributions << 'EOF'
          Codename: noble
          Suite: noble
          Components: main
          Architectures: amd64 arm64 source
          Description: Caffyne Shell apt repo (Ubuntu 24.04)
          SignWith: yes

          Codename: bookworm
          Suite: bookworm
          Components: main
          Architectures: amd64 arm64 source
          Description: Caffyne Shell apt repo (Debian 12)
          SignWith: yes
          EOF

          cat > conf/options << 'EOF'
          ask-passphrase
          EOF

      - name: Publish debs with reprepro
        run: |
          for deb in incoming/noble/*.deb; do
            reprepro includedeb noble "$deb"
          done
          for deb in incoming/bookworm/*.deb; do
            reprepro includedeb bookworm "$deb"
          done

      - name: Generate repo index page
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Caffyne Shell apt repo</title></head>
          <body>
          <h1>Caffyne Shell apt repo</h1>
          <h2>Ubuntu 24.04 (noble)</h2>
          <pre>
          echo "deb [signed-by=/etc/apt/keyrings/caffyne.gpg] https://caffyne-org.github.io/caffyne-deb noble main" \
            | sudo tee /etc/apt/sources.list.d/caffyne.list
          </pre>
          <h2>Debian 12 (bookworm)</h2>
          <pre>
          echo "deb [signed-by=/etc/apt/keyrings/caffyne.gpg] https://caffyne-org.github.io/caffyne-deb bookworm main" \
            | sudo tee /etc/apt/sources.list.d/caffyne.list
          </pre>
          </body>
          </html>
          EOF

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish apt repo [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || echo "Nothing to commit"
          git push origin gh-pages
